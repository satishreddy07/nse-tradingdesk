name: CI & Deployment Pipeline (Retired - VPS Native Deployment Active)

on:
  # Routine automatic execution migrated to server-side autonomous updater timer on VPS.
  # Pushing to main no longer triggers GitHub Actions runners.
  # Manual workflow_dispatch is retained strictly for emergency administrative fallback.
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production Deployment (Emergency Fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Production Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            /usr/local/bin/deploy-nse-tradingdesk
