<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Candlestick chart grid in background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="2">
    <line x1="80" y1="120" x2="432" y2="120" stroke-dasharray="6 6"/>
    <line x1="80" y1="200" x2="432" y2="200" stroke-dasharray="6 6"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke-dasharray="6 6"/>
    <line x1="80" y1="360" x2="432" y2="360" stroke-dasharray="6 6"/>
  </g>

  <!-- Candlestick Graphic Left -->
  <g transform="translate(110, 160)">
    <!-- Candle 1: Bullish Green -->
    <line x1="30" y1="40" x2="30" y2="190" stroke="#10b981" stroke-width="4"/>
    <rect x="18" y="70" width="24" height="80" rx="4" fill="#10b981"/>

    <!-- Candle 2: Red pullback -->
    <line x1="70" y1="80" x2="70" y2="210" stroke="#f43f5e" stroke-width="4"/>
    <rect x="58" y="110" width="24" height="60" rx="4" fill="#f43f5e"/>

    <!-- Candle 3: Breakout Green -->
    <line x1="110" y1="20" x2="110" y2="170" stroke="#10b981" stroke-width="4"/>
    <rect x="98" y="40" width="24" height="100" rx="4" fill="#10b981" filter="url(#glow)"/>
  </g>

  <!-- Bull Horns / Quant Upward Trend Graphic -->
  <path d="M 270 340 C 310 320, 360 260, 390 170 C 365 210, 325 240, 290 250 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 230 350 L 330 250 L 380 300 L 440 180" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="440,180 405,190 425,220" fill="#38bdf8"/>

  <!-- NSE Text Logo Accent -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">NSE QUANT</text>
  <text x="256" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="6">TRADING DESK</text>
</svg>
