services:
  - type: web
    name: nse-tradingdesk
    env: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Kolkata
      - key: RENDER_EXTERNAL_URL
        value: "https://nse-tradingdesk.onrender.com"
      - key: P1_BASE_CAPITAL
        value: "500000.0"
      - key: P2_BASE_CAPITAL
        value: "100000.0"
      - key: P2_RISK_PER_TRADE
        value: "0.015"
      - key: P2_MAX_SLOTS
        value: "10"
