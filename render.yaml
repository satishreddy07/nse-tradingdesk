services:
  - type: web
    name: quant-trading-desk
    env: python
    region: singapore # Closest region to India / NSE for low-latency
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TZ
        value: Asia/Kolkata
      - key: P1_BASE_CAPITAL
        value: "500000.0"
      - key: P2_BASE_CAPITAL
        value: "100000.0"
      - key: P2_RISK_PER_TRADE
        value: "0.015"
      - key: P2_MAX_SLOTS
        value: "10"
